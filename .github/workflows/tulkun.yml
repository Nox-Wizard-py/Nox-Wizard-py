
name: Update Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Profile Animations
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate GitHub contribution Snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nox-Wizard-py
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Generate Tulkun independently
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          login: Nox-Wizard-py
          view: side
          window: annual
          canon: "false"
          output-dir: tulkun
          commit: "false"

      # 4. Create a fresh deployment directory
      - name: Prepare deployment directory
        run: |
          mkdir -p site/tulkun

          # Copy Snake animations
          cp dist/github-contribution-grid-snake.svg site/
          cp dist/github-contribution-grid-snake-dark.svg site/

          # Copy Tulkun assets
          cp -a tulkun/. site/tulkun/

      # 5. Verify all generated assets
      - name: Verify generated animations
        run: |
          echo "Checking Snake..."
          test -s site/github-contribution-grid-snake.svg
          test -s site/github-contribution-grid-snake-dark.svg

          echo "Checking Tulkun..."
          test -s site/tulkun/tulkun.gif
          test -s site/tulkun/tulkun.png
          test -s site/tulkun/share-card.png

          echo "All assets verified!"
          find site -type f

      # 6. Deploy everything to output branch
      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
