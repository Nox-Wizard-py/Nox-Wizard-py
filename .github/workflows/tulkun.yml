
name: Update Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Profile Animations
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate contribution Snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nox-Wizard-py
          outputs: |
            public/github-contribution-grid-snake.svg
            public/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Generate Tulkun
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          view: side
          canon: "false"
          output-dir: tulkun
          commit: "false"

      # 4. Prepare combined deployment directory
      - name: Prepare deployment directory
        run: |
          mkdir -p public/tulkun
          cp -a tulkun/. public/tulkun/

      # 5. Verify generated files
      - name: Verify generated animations
        run: |
          echo "Checking Snake files..."
          test -s public/github-contribution-grid-snake.svg
          test -s public/github-contribution-grid-snake-dark.svg

          echo "Checking Tulkun files..."
          test -s public/tulkun/tulkun.gif
          test -s public/tulkun/tulkun.png
          test -s public/tulkun/share-card.png

          echo "All animation files generated successfully!"

      # 6. Deploy everything together
      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: public
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
