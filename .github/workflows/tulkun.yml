
name: Update Profile Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Profile Animations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate Galaga contribution animation
      - name: Generate Galaga
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: Nox-Wizard-py
          games: 'galaga'
          hide_month_labels: 'false'

      # 3. Create deployment staging directory
      - name: Prepare deployment directory
        run: |
          mkdir -p site/tulkun

          cp dist/galaga-contribution-graph.svg site/
          cp dist/galaga-contribution-graph-dark.svg site/

      # 4. Generate Tulkun
      - name: Generate Tulkun
        uses: PramudithaN/git-tulkun@v1
        with:
          login: Nox-Wizard-py
          view: top
          window: annual
          canon: "false"
          output-dir: tulkun
          commit: "false"

      # 5. Collect Tulkun assets
      - name: Collect Tulkun assets
        run: |
          cp -a tulkun/. site/tulkun/

      # 6. Verify generated files
      - name: Verify animations
        run: |
          echo "Checking Galaga..."
          test -s site/galaga-contribution-graph.svg
          test -s site/galaga-contribution-graph-dark.svg

          echo "Checking Tulkun..."
          test -s site/tulkun/tulkun.gif
          test -s site/tulkun/tulkun.png
          test -s site/tulkun/share-card.png

          echo "All animations generated successfully!"
          find site -type f

      # 7. Deploy everything
      - name: Deploy animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: site
          commit_message: "chore: update profile animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
